plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.tygabeast.kakugane'
base { archivesName = 'kakugane' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kakugane'
        }
    }
    mods {
        kakugane { sourceSet sourceSets.main }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Automated server-side tests (not part of the released jar): gradle runGameTestServer
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
neoForge {
    addModdingDependenciesTo sourceSets.gametest
    mods {
        kakugane { sourceSet sourceSets.gametest }
    }
    runs {
        // Dev-only: a real client under a virtual display, driven by the screenshot harness in src/gametest
        // (enabled with -Dkakugane.shots=true). Not part of the released jar.
        shotsClient {
            client()
            sourceSet = sourceSets.gametest
            systemProperty 'kakugane.shots', providers.gradleProperty('shots').getOrElse('forms')
            systemProperty 'kakugane.quick', providers.gradleProperty('quick').getOrElse('false')
            programArguments.addAll '--width', '960', '--height', '540', '--quickPlaySingleplayer', 'shots'
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'kakugane'
            sourceSet = sourceSets.gametest
        }
    }
}

jar {
    from('README.md')
    from('LICENSE')
}
